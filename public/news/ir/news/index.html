    <div id="headerOutPut" class="bgDeepBlue white">
      <script>
        var date_obj = new Date();
        var tparm = Math.floor(date_obj.getTime() / 1000);
        var url = "/news/parts/header.html?" + tparm;
        $("#headerOutPut").load(url);

    <main id="top">

        </div>
        <script src="../js/script.js"></script>
      </div>
      <!-- おしらせ -->
      <div id="irNewsSelect">
        <div id="yearList"></div>
        <ul id="irNewsButton">
          <li id="top_nav01">
            <a
              href="javascript:void(0)"
              onClick="TabLink_onclick('newt',0);return false;"
              class="irNewsTab bgDeepBlue shadow center white fontSize26 selected"
              >ニュース一覧</a
            >
          </li>
          <li id="top_nav02">
            <a
              href="javascript:void(0)"
              class="irNewsTab bgWhite shadow center deepBlue fontSize26"

          </li>
          <li id="top_nav04">
            <a
              href="javascript:void(0)"
              class="irNewsTab bgWhite shadow center deepBlue fontSize26"
              onClick="TabLink_onclick('pr',3);return false;"
              >PR情報</a
            >
          </li>
        </ul>

      <div id="news" class="irNewsPage">
        <div class="irPage">
          <!-- ================================= E-IRによる情報の自動出力に必要な部分 ========================== -->
          <div class="irHeading">ニュース一覧</div>
          <div id="announcement">

            <!-- ========セレクトタブのついた最新情報の出力に使うJS。js_ir/announcement_ir_tab.js========= -->
