<script>
  $(document).ready(function () {
    // ハンバーガーメニュー処理
    $(".navbar-toggler").on("click", function (e) {
      e.preventDefault();
      $(this).toggleClass("open");
      $(".navbar-collapse").toggleClass("show");
    });

    // 画面外クリックでメニュー閉じる
    $(document).on("click", function (event) {
      if (
        !$(event.target).closest(".navbar-collapse").length &&
        !$(event.target).closest(".navbar-toggler").length
      ) {
        $(".navbar-toggler").removeClass("open");
        $(".navbar-collapse").removeClass("show");
      }
    });

    // メニュー項目クリックでメニュー閉じる（TEAMSのドロップダウントグルを除く）
    $(".nav-link:not(.dropdown-toggle)").on("click", function () {
      $(".navbar-toggler").removeClass("open");
      $(".navbar-collapse").removeClass("show");
    });

    // ドロップダウンメニュー処理の修正
    $(".dropdown-toggle").on("click", function (e) {
      e.preventDefault();
      e.stopPropagation(); // イベントの伝播を停止
      $(this).parent().toggleClass("show");
      $(this).next(".dropdown-menu").toggleClass("show");
    });

    // ドロップダウンメニュー内の項目クリック時
    $(".dropdown-item").on("click", function (e) {
      // ドロップダウンメニューの項目のクリックはメインメニューを閉じる
      $(".navbar-toggler").removeClass("open");
      $(".navbar-collapse").removeClass("show");
      // 親のドロップダウンメニューのshowクラスも削除
      $(this).closest(".dropdown").removeClass("show");
      $(this).closest(".dropdown-menu").removeClass("show");
    });

    // スクロール処理でナビバー固定
    // $(window).on("scroll", function () {
    //   console.log($(this).scrollTop());
    //   if ($(this).scrollTop() > 320) {
    //     $(".navbar").addClass("navbar-fixed");
    //   } else {
    //     $(".navbar").removeClass("navbar-fixed");
    //   }
    // });
  });
</script>

<style>
  #headerOutPut {
    height: 86px;
  }

  /* Navbar基本スタイル */
  .navbar {
    background-color: var(--bg-header);
    position: relative;
    display: flex;
    /* padding: 1rem; */
    /* height: 100%; */
    width: 100%;
    min-width: 100%;
    z-index: 1000;
    transition: all 0.4s ease;
    padding: 0 8%;
  }

  .container {
    width: 100%;
    display: flex;
    align-items: center;
    justify-content: space-between;
  }

  .logo {
    display: block;
    width: fit-content;
    height: auto;
    position: relative;
    z-index: 1030;
  }

  .logo:hover {
    opacity: 0.8;
  }

  .logo img {
    width: 200px;
    transition: width 0.3s ease;
    display: block;
  }

  /* Navbar固定スタイルの修正 */
  .navbar-fixed {
    position: fixed;
    top: 0;
    left: 0;
    right: 0;
    width: 100%;
    z-index: 1030;
    box-shadow: 0 4px 10px rgba(0, 0, 0, 0.1);
    animation: slideDown 0.5s forwards;
    background-color: var(--bg-header);
  }

  /* ここで.containerの最大幅を戻す */
  /* .navbar-fixed .container {
    max-width: 1200px;
    width: 100%;
    padding: 0 15px;
  } */

  @keyframes slideDown {
    0% {
      opacity: 0;
      transform: translateY(-100%);
    }
    100% {
      opacity: 1;
      transform: translateY(0);
    }
  }

  /* ナビゲーションメニュー */
  .navbar-nav {
    display: flex;
    list-style: none;
    margin: 0;
    padding: 0;
    width: 100%;
  }

  .nav-item {
    padding: 24px 4px;
    margin: 0 10px;
    position: relative;
  }

  .nav-link {
    color: #fff;
    text-decoration: none;
    padding: 4px 4px;
    display: block;
    font-size: 12px;
    font-weight: 500;
    transition: color 0.3s ease;
    cursor: pointer;
  }

  .nav-link:hover {
    color: var(--color-blue);
  }

  /* ドロップダウンメニュー */
  .dropdown-menu {
    position: absolute;
    min-width: 200px;
    box-shadow: 0 8px 16px rgba(0, 0, 0, 0.1);
    z-index: 1;
    padding: 10px 0;
    margin: 0;
    list-style: none;
    border-radius: 4px;
    display: none;
  }

  .dropdown-menu.show {
    display: block;
  }

  .dropdown-item {
    color: #333;
    padding: 8px 16px;
    text-decoration: none;
    display: block;
    font-size: 14px;
  }

  .dropdown-item:hover {
    color: var(--color-blue);
  }

  /* ハンバーガーメニュー */
  .navbar-toggler {
    display: none;
    background: transparent;
    border: none;
    cursor: pointer;
    z-index: 1050;
  }

  .hamburger-icon {
    width: 25px;
    height: 18px;
    position: relative;
    cursor: pointer;
  }

  .hamburger-icon span {
    display: block;
    position: absolute;
    height: 2px;
    width: 100%;
    background: #fff;
    border-radius: 2px;
    opacity: 1;
    left: 0;
    transform: rotate(0deg);
    transition: 0.3s ease-in-out;
  }

  .hamburger-icon .first-line {
    top: 0px;
  }

  .hamburger-icon .middle-line {
    top: 8px;
  }

  .hamburger-icon .last-line {
    top: 16px;
  }

  /* ハンバーガーメニュー（開いた状態） */
  .navbar-toggler.open .first-line {
    top: 8px;
    transform: rotate(135deg);
  }

  .navbar-toggler.open .middle-line {
    opacity: 0;
    left: -30px;
  }

  .navbar-toggler.open .last-line {
    top: 8px;
    transform: rotate(-135deg);
  }

  /* レスポンシブ対応 - モバイルメニュー表示部分だけを変更 */
  @media (max-width: 991px) {
    .navbar,
    #headerOutPut {
      min-height: 64px;
      max-height: 64px;
    }
    /* ハンバーガーボタンはそのまま */
    .navbar-toggler {
      display: block;
    }

    /* モバイルメニューのスタイルを変更 */
    .navbar-collapse {
      /* position: fixed; */
      position: absolute;
      top: 60px;
      left: 0;
      right: 0;
      width: 100%;
      height: auto;
      max-height: calc(100vh - 60px);
      background-color: var(--bg-header);
      z-index: 1040;
      padding: 24px 0;
      /* box-shadow: 0 5px 15px rgba(0, 0, 0, 0.1); */
      background: rgba(0, 0, 0, 0.9) !important;
      display: none;
      overflow-y: auto;
      text-align: center;
    }

    .navbar-collapse.show {
      display: block;
    }

    /* メニュー項目のスタイル */
    .navbar-nav {
      flex-direction: column;
      align-items: center;
      justify-content: center;
      width: 100%;
      margin: 0 auto;
    }

    .nav-item {
      padding: 0;
      width: 100%;
      margin: 5px 0;
      text-align: center;
    }

    .nav-link {
      padding: 10px 0;
      font-size: 12px;
      text-align: center;
      display: inline-block;
    }

    /* ドロップダウンメニュー */
    .dropdown-menu {
      position: static;
      width: 100%;
      background-color: var(--bg-header);
      box-shadow: none;
      display: none;
      padding: 12px;
      margin: 0 auto;
      margin-top: 5px;
      text-align: center;
      border-radius: 0;
    }

    .dropdown-menu.show {
      display: block;
    }

    .dropdown-item {
      color: #ddd;
      /* padding: 10px 15px; */
      text-align: center;
      font-size: 14px;
    }

    .dropdown-item:hover {
      background-color: #222;
    }

    /* ドロップダウン矢印アイコン */
    .dropdown-arrow {
      border-top: 3px solid #fff;
      border-right: 3px solid transparent;
      border-left: 3px solid transparent;
    }
  }

  @media (max-width: 767px) {
    .navbar,
    #headerOutPut {
      padding-top: 4px;
      min-height: 64px;
      max-height: 64px;
    }
    .logo img {
      width: 140px;
    }
  }

  @media (max-width: 480px) {
    .navbar {
      padding: 0 2%;
    }
    .navbar,
    #headerOutPut {
      padding-top: 2px;
      min-height: 48px;
      max-height: 48px;
    }
    .logo img {
      width: 120px;
    }
    .navbar-collapse {
      top: 48px;
    }
    .navbar-fixed {
      animation-duration: 0s;
    }
  }

  /* ドロップダウン矢印アイコン */
  .dropdown-arrow {
    display: inline-block;
    width: 0;
    height: 0;
    margin-left: 4px;
    vertical-align: middle;
    border-top: 4px solid #fff;
    border-right: 4px solid transparent;
    border-left: 4px solid transparent;
  }

  /* ドロップダウンが開いているときの矢印 */
  .dropdown.show .dropdown-arrow {
    transform: rotate(180deg);
  }
</style>
